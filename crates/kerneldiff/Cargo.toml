[package]
name = "soteria-kerneldiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Differential testing of the Soteria model against the Linux kernel"
publish = false

[[bin]]
name = "soteria-kerneldiff"
path = "src/main.rs"

[dependencies]
soteria-ir = { workspace = true }
soteria-engine = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
