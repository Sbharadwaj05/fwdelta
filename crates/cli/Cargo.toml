[package]
name = "fwdelta-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Semantic diff and formal reachability analysis for firewall policy"

[[bin]]
name = "fwdelta"
path = "src/main.rs"

[dependencies]
fwdelta-ir = { workspace = true }
fwdelta-engine = { workspace = true }
fwdelta-nft = { workspace = true }
fwdelta-policy = { workspace = true }
biodivine-lib-bdd = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
