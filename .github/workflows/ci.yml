name: ci

# Four gates, three of which check a claim the blueprint makes in prose:
#
#   correctness    the test suite and the engine's own self-checks
#   supply-chain   deny.toml, which makes the §03 air-gap claim reviewable
#   air-gap        a static musl binary, straced, proving no socket syscalls
#   kernel         the model measured against the thing it models (§07)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  correctness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      # The enumerator gate asserts its own output is lossless, and the
      # benchmark asserts the partition invariant. Both are cheap; running them
      # here means a regression in either is a failed build, not a surprise the
      # next time someone happens to run an example.
      - run: cargo run --release -p fwdelta-engine --example enumerator_gate
      - run: cargo run --release -p fwdelta-engine --example thousand_rules

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  air-gap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y strace musl-tools

      - name: Build the shipped artifact
        run: cargo build --release --target x86_64-unknown-linux-musl --workspace --examples

      # "Copy one file onto an isolated machine and run it" is only true if the
      # file has no dynamic dependencies.
      - name: It must be statically linked
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/fwdelta
          file "$BIN"
          file "$BIN" | grep -q 'static' || { echo "not statically linked"; exit 1; }
          ldd "$BIN" 2>&1 | grep -q 'not a dynamic executable\|statically linked'

      # deny.toml bans network-capable crates by name, which is a tripwire, not
      # a proof. This is the dynamic half, and it audits the shipped binary
      # doing real work rather than a stand-in: parse two rulesets, build both
      # models, diff, attribute and enumerate.
      - name: It must issue no network syscalls
        run: |
          ./scripts/syscall-audit.sh \
            target/x86_64-unknown-linux-musl/release/fwdelta \
            diff --base fixtures/cell-gateway-base.nft \
                 --head fixtures/cell-gateway-head.nft \
                 --assert fixtures/cell-gateway.policy.toml \
                 --attest /dev/null --format json

  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Section 03 claims a third party can rebuild the published binary and
      # compare digests. Two builds on one host catch embedded paths,
      # timestamps and incremental state; they do not prove cross-machine
      # reproducibility, which is what publishing the digest is for.
      - name: Two builds of identical source must agree
        run: ./scripts/reproducible-build.sh

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Section 08 lists a container image as a distribution channel, so it has
      # to build. The final stage is scratch, so a successful run of the binary
      # inside it also demonstrates the static link.
      - name: Build the image
        run: docker build -f Containerfile -t fwdelta:ci .
      - name: It must run with nothing else in the image
        run: |
          docker run --rm -v "$PWD/fixtures:/f:ro" fwdelta:ci \
            diff --base /f/cell-gateway-base.nft --head /f/cell-gateway-head.nft \
            || [ $? -eq 1 ]

  kernel-differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2 socat iputils-ping

      # The fixtures are inputs to the frontend, so nftables itself is the
      # authority on whether they are valid. A fixture the real parser would
      # reject teaches the wrong lesson about what the subset supports.
      - name: Fixtures must be valid nftables
        run: |
          for f in fixtures/*.nft; do
            sudo unshare -n nft -c -f "$f" || { echo "invalid fixture: $f"; exit 1; }
            echo "ok: $f"
          done

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor. The
      # harness deliberately needs no root, so lift the restriction rather than
      # running it privileged.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: cargo build --release -p fwdelta-kerneldiff

      # A fault that goes undetected means the harness cannot see the dimension
      # it breaks, and agreement below would prove nothing.
      - name: The harness must be able to fail
        run: ./target/release/fwdelta-kerneldiff --self-test --rules 30 --packets 30 --rounds 2

      - name: The model must agree with the kernel
        run: ./target/release/fwdelta-kerneldiff --rules 50 --packets 120 --rounds 4

      # The differential harness cannot find matches the kernel silently
      # ignores, because it generates rulesets from the model under test. This
      # sweep can, and the committed table must not drift.
      - name: Hook x match matrix must match the committed table
        run: |
          ./scripts/hook-match-sweep.sh --markdown > /tmp/matrix.md
          if ! grep -qF "$(sed -n '/^| match |/,/^| .oifname/p' /tmp/matrix.md | tail -1)" \
                 docs/HOOK-MATCH-MATRIX.md; then
            echo "the sweep disagrees with docs/HOOK-MATCH-MATRIX.md"
            diff <(sed -n '/^| match |/,$p' /tmp/matrix.md) \
                 <(sed -n '/^| match |/,/^$/p' docs/HOOK-MATCH-MATRIX.md) || true
            exit 1
          fi
